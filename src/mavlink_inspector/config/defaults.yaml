# ── Duburi 4.2 Default Configuration ─────────────────────────────────
# All tunable parameters for the mavlink_inspector node.
# Copy this file and modify for different environments:
#   config/pool_test.yaml  — shallow pool with calm water
#   config/competition.yaml — competition-specific overrides
#
# Usage:
#   ros2 launch mavlink_inspector duburi_control.launch.py \
#       params_file:=<path>/defaults.yaml

mavlink_inspector:
  ros__parameters:
    # ── Connection ─────────────────────────────────────────────────
    # SITL example: sim_vehicle --out=udp:127.0.0.1:5760 → use udpin:127.0.0.1:5760
    # (not tcp:127.0.0.1:5760; that is a different socket and often stays idle.)
    connection_port: "/dev/ttyACM0"
    baud: 115200

    # ── Connection health ──────────────────────────────────────────
    heartbeat_timeout: 3.0       # seconds before heartbeat loss warning
    reconnect_backoff: 2.0       # initial reconnect delay (doubles on failure)
    reconnect_max: 15.0          # max reconnect delay (seconds)

    # ── Telemetry ──────────────────────────────────────────────────
    # Which MAVLink message supplies yaw: 'attitude', 'ahrs2', or 'both'
    yaw_source: "attitude"

    # ── Movement ramp ──────────────────────────────────────────────
    # PWM/second — controls accel/decel smoothness.
    # 800 = 0.5s full-range ramp. Lower = smoother but slower response.
    ramp_rate: 800

    # ── Depth PID (software, via RC throttle) ──────────────────────
    # POOL-TUNED defaults (2026-03-09 session):
    depth_kp: 800.0       # Proportional gain
    depth_ki: 50.0        # Integral gain (buoyancy compensation)
    depth_kd: 100.0       # Derivative gain (damping)
    depth_max_integral: 1.0   # Integral clamp (prevents windup)
    depth_tolerance: 0.08     # Deadband in metres (suppress sensor noise)

    # ── Yaw PID (heading hold via RC yaw channel) ──────────────────
    yaw_kp: 2.0
    yaw_ki: 0.05
    yaw_kd: 0.5
    yaw_max_integral: 50.0

    # ── PID rate limiting ──────────────────────────────────────────
    # Max PWM change per tick — prevents thruster hunting.
    pid_max_rate: 50

    # ── Battery voltage compensation ───────────────────────────────
    # Set to nominal pack voltage (e.g. 14.8 for 4S LiPo) to scale
    # thrust as battery depletes.  0.0 = disabled.
    nominal_voltage: 0.0

    # ── Surface depth offset ───────────────────────────────────────
    # Barometer reading at water surface. Auto-calibrated on first arm.
    # Set manually if auto-calibration is unreliable.
    surface_depth: 0.0

    # ── Command ACK ────────────────────────────────────────────────
    ack_timeout: 3.0    # seconds to wait for COMMAND_ACK

    # ── Surface command ────────────────────────────────────────────
    surface_throttle_duration: 10.0  # seconds of throttle-up in MANUAL mode

mavlink_logger:
  ros__parameters:
    log_directory: "~/auv_logs"
