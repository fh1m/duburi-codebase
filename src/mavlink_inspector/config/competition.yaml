# ── Competition Configuration ────────────────────────────────────────
# Starting point for competition tuning.
# Copy and adjust gains based on venue conditions.
#
# Usage:
#   ros2 launch mavlink_inspector duburi_control.launch.py \
#       params_file:=$(ros2 pkg prefix mavlink_inspector)/share/mavlink_inspector/config/competition.yaml

mavlink_inspector:
  ros__parameters:
    # Competition overrides - tuned for performance
    
    # Depth PID - deeper operation
    depth_kp: 800.0
    depth_ki: 50.0
    depth_kd: 150.0
    depth_tolerance: 0.08
    
    # Yaw PID
    yaw_ema_alpha: 0.3
    yaw_anti_windup: true
    
    # Movement - faster response
    ramp_rate: 1000
    decel_time: 1.2
    brake_enabled: true
    brake_strength: 0.35
    brake_duration: 0.5
    min_speed_pct: 10.0
    
    # Safety
    rc_watchdog_timeout: 0.5

mavlink_logger:
  ros__parameters:
    log_directory: "~/auv_logs"
