# ── Pool Test Configuration ──────────────────────────────────────────
# Optimised for shallow pool testing (1-2m depth, calm water).
# Tuned from 2026-03-09 pool session.
#
# Usage:
#   ros2 launch mavlink_inspector duburi_control.launch.py \
#       params_file:=$(ros2 pkg prefix mavlink_inspector)/share/mavlink_inspector/config/pool_test.yaml

mavlink_inspector:
  ros__parameters:
    # Pool testing overrides - conservative settings
    connection_port: "/dev/ttyACM0"
    
    # Depth PID - shallow pool
    depth_kp: 500.0
    depth_ki: 25.0
    depth_kd: 100.0
    depth_tolerance: 0.05
    
    # Yaw PID
    yaw_ema_alpha: 0.3
    yaw_anti_windup: true
    
    # Movement - conservative for pool
    ramp_rate: 600
    decel_time: 0.8
    brake_enabled: true
    brake_strength: 0.25
    brake_duration: 0.4
    min_speed_pct: 15.0
    
    # Safety
    rc_watchdog_timeout: 0.5

mavlink_logger:
  ros__parameters:
    log_directory: "~/auv_logs"
